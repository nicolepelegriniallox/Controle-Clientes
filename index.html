<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Acompanhamento - Processos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f1e7;--paper-alt:#efe7d6;--ink:#211f1a;--ink-soft:#5b564a;--navy:#1b2a44;--navy-soft:#2c3e5c;--gold:#b07c2c;--green:#3f6d52;--green-soft:#e7efe9;--brick:#9c4632;--brick-soft:#f4e5e0;--line:#d9cfb8;--card-bg:#fffdf8;--shadow:0 1px 0 rgba(33,31,26,.06),0 8px 20px -12px rgba(33,31,26,.25)}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:radial-gradient(1200px 600px at 10% -10%,#fffdf7 0%,transparent 60%),var(--paper);color:var(--ink);font-family:Inter,sans-serif;min-height:100vh;padding-bottom:60px}.wrap{max-width:1040px;margin:auto;padding:28px 20px 0}
.capa{background:var(--navy);color:var(--paper);border-radius:14px;padding:26px 28px;position:relative;overflow:hidden;box-shadow:var(--shadow)}.capa:after{content:"";position:absolute;top:0;right:0;bottom:0;width:10px;background:repeating-linear-gradient(180deg,var(--gold) 0 10px,transparent 10px 20px);opacity:.8}.capa-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}.eyebrow{font:11px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#c9b98a;margin:0 0 6px}h1{font:600 30px/1.15 Fraunces,serif;margin:0}.vendedor{font:12px 'IBM Plex Mono',monospace;color:#d8cfb4;text-align:right}.vendedor input,.vendedor select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:var(--paper);font:13px 'IBM Plex Mono',monospace;padding:6px 9px;border-radius:6px;margin-top:4px;width:190px}.vendedor select{background:#fff;color:var(--ink)}.vendedor input::placeholder{color:#9aa4b8}.stats{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px 12px;font:12px 'IBM Plex Mono',monospace;min-width:88px}.stat b{display:block;font:600 18px Fraunces,serif;color:#fff}
.tabs{display:flex;gap:4px;margin-top:22px;overflow-x:auto;padding-bottom:2px}.tab{font:12.5px 'IBM Plex Mono',monospace;white-space:nowrap;padding:10px 16px 9px;background:var(--paper-alt);border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;cursor:pointer;color:var(--ink-soft);position:relative;top:1px}.tab .count{display:inline-block;margin-left:6px;background:var(--ink);color:var(--paper);border-radius:20px;font-size:10px;padding:1px 6px;font-weight:600}.tab.active{background:var(--card-bg);color:var(--ink);border-bottom:1px solid var(--card-bg);font-weight:600}.tab.active .count{background:var(--navy)}.tab.rev{margin-left:14px;color:var(--brick)}.tab.rev .count{background:var(--brick)}
.panel{background:var(--card-bg);border:1px solid var(--line);border-radius:0 10px 10px 10px;padding:22px 22px 26px;box-shadow:var(--shadow)}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}.panel-title{font:600 20px Fraunces,serif}.panel-desc{font-size:12.5px;color:var(--ink-soft);margin-top:2px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search,input,select,textarea{font:13px Inter,sans-serif;border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 10px;color:var(--ink)}.search{width:200px}button{font:600 12.5px Inter,sans-serif;border:0;border-radius:7px;padding:8px 13px;cursor:pointer}button:active{transform:scale(.97)}.primary{background:var(--navy);color:#fff}.primary:hover{background:var(--navy-soft)}.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line)}.green{background:var(--green);color:#fff}.brick{background:transparent;color:var(--brick);border:1px solid var(--brick)}.danger{background:transparent;color:#8a3527;font-size:11.5px;padding:5px 8px}.saved{font:11px 'IBM Plex Mono',monospace;color:var(--green);display:flex;align-items:center;gap:5px}.saved:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}.saved.saving{color:var(--gold)}.saved.saving:before{background:var(--gold)}.saved.error{color:var(--brick)}.saved.error:before{background:var(--brick)}
.form{display:none;background:var(--paper-alt);border:1px dashed var(--line);border-radius:10px;padding:16px;margin-bottom:18px}.form.show{display:block}.celebration{display:none;background:var(--green-soft);border:1px solid #b8cfbd;border-left:4px solid var(--green);border-radius:8px;padding:13px 16px;margin-bottom:16px;color:var(--green)}.celebration.show{display:block;animation:celebrate .35s ease-out}.celebration strong{display:block;font:600 18px Fraunces,serif;color:var(--ink)}.celebration span{font-size:12px}.celebration-actions{display:flex;gap:7px;margin-top:11px}.celebration.final{background:#f8edd7;border-color:#dec38e;border-left-color:var(--gold)}.celebration.final span{color:#78551d}@keyframes celebrate{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.grid label{font:11px 'IBM Plex Mono',monospace;color:var(--ink-soft);display:block;margin-bottom:3px}.grid>div{display:flex;flex-direction:column}.grid input,.grid textarea{width:100%}.form-actions{margin-top:12px;display:flex;gap:8px;justify-content:flex-end}.list{display:flex;flex-direction:column;gap:10px}.empty{text-align:center;padding:40px 10px;color:var(--ink-soft);font:13px 'IBM Plex Mono',monospace}.card{border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:8px;padding:14px 16px;display:flex;justify-content:space-between;gap:14px;background:#fff;flex-wrap:wrap;align-items:center}.card.reversed{border-left-color:var(--brick)}.card-info{flex:1;min-width:220px}.name{font-weight:700;font-size:15px}.sub{font:12px 'IBM Plex Mono',monospace;color:var(--ink-soft);margin-top:2px}.obs{font-size:12px;color:var(--ink-soft);margin-top:6px;font-style:italic}.stamp{font:600 10px/1.15 'IBM Plex Mono',monospace;border:1.5px dashed var(--gold);color:var(--gold);border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-8deg);flex-shrink:0}.stamp.rev{border-color:var(--brick);color:var(--brick)}.actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}.actions-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.mini{font-size:11.5px;padding:6px 8px}.reverse-box{display:none;margin-top:10px;width:100%;background:var(--brick-soft);border:1px solid #e0bfb2;border-radius:8px;padding:10px}.reverse-box.show{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.reverse-box input{flex:1;min-width:160px}.reverse-tag{font:11px 'IBM Plex Mono',monospace;color:var(--brick);margin-top:4px}footer{text-align:center;font:11px 'IBM Plex Mono',monospace;color:var(--ink-soft);margin-top:20px}
@media(max-width:560px){.capa{padding:20px}h1{font-size:24px}.vendedor{text-align:left}.card{flex-direction:column;align-items:flex-start}.actions{align-items:flex-start;width:100%}.panel{padding:18px 14px}}
@media print{body *{visibility:hidden}.celebration.show,.celebration.show *{visibility:visible}.celebration.show{position:absolute;left:20px;right:20px;top:20px;box-shadow:none}.celebration-actions{display:none}}
</style>
</head>
<body><main class="wrap">
<header class="capa"><div class="capa-top"><div><p class="eyebrow">Painel de acompanhamento · Administrativo</p><h1>Suas vendas, ficha por ficha</h1></div><label class="vendedor">Vendedor(a)<select id="seller"><option value="">Selecione o vendedor</option><option>KELLY</option><option>JULIA</option><option>EWILLY</option><option>HELLEN</option><option>JULIANA BRENDA</option></select></label></div><div class="stats" id="stats"></div></header>
<nav class="tabs" id="tabs" aria-label="Etapas do processo"></nav>
<section class="panel"><div class="panel-head"><div><div class="panel-title" id="title"></div><div class="panel-desc" id="description"></div></div><div class="toolbar"><span class="saved" id="saved">tudo salvo</span><input class="search" id="search" type="search" placeholder="Buscar cliente ou banco..." aria-label="Buscar cliente ou banco"><button class="primary" id="new">+ Nova venda</button></div></div>
<div class="form" id="form"><div class="grid"><div><label for="client">Cliente</label><input id="client" placeholder="Nome do cliente"></div><div><label for="bank">Banco</label><input id="bank" placeholder="Instituição"></div><div><label for="value">Valor (R$)</label><input id="value" type="number" placeholder="0,00" step="0.01" min="0"></div><div><label for="date">Data de entrada</label><input id="date" type="date"></div></div><div class="grid" style="margin-top:10px"><div style="grid-column:1/-1"><label for="note">Observação (opcional)</label><textarea id="note" rows="2" placeholder="Alguma anotação sobre o caso..."></textarea></div></div><div class="form-actions"><button class="ghost" id="cancel">Cancelar</button><button class="primary" id="save">Salvar ficha</button></div></div><div class="celebration" id="celebration" role="status" aria-live="polite"></div>
<div class="list" id="list"></div></section><footer>registros salvos automaticamente · visíveis apenas para você</footer></main>
<script>
const STAGES=[['boas-vindas','Boas-vindas','BV','Primeiro contato com o cliente.'],['coleta-docs','Coleta de Docs','CD','Reunindo os documentos necessários.'],['reclamacoes','Reclamações','RC','Reclamação registrada junto à instituição.'],['contestacoes','Contestações','CT','Contestação em análise.'],['finalizacao','Finalização','FZ','Caso encaminhado para fechamento.'],['juridico','Jurídico','JR','Encaminhado ao setor jurídico.']];
const REV=['reversoes','Reversões','RV','Vendas revertidas em algum ponto do processo.'];let data=[],active=STAGES[0][0],last='';const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10),stage=id=>STAGES.find(s=>s[0]===id)||REV,next=id=>{const i=STAGES.findIndex(s=>s[0]===id);return i>=0&&i<STAGES.length-1?STAGES[i+1][0]:null},money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),date=v=>v?new Date(v+'T00:00:00').toLocaleDateString('pt-BR'): '-',days=v=>v?Math.max(0,Math.floor((Date.now()-new Date(v+'T00:00:00'))/86400000)):'';
function setSaved(type='ok'){const el=$('saved');el.className='saved '+(type==='saving'?'saving':type==='error'?'error':'');el.textContent=type==='saving'?'salvando...':type==='error'?'erro ao salvar':'tudo salvo'}
async function store(){setSaved('saving');try{localStorage.setItem('pipeline-data',JSON.stringify(data));last=JSON.stringify(data);setSaved()}catch(e){setSaved('error')}}
function renderTabs(){$('tabs').innerHTML=STAGES.map(s=>`<button class="tab ${active===s[0]?'active':''}" data-stage="${s[0]}">${s[1]}<span class="count">${data.filter(v=>v.stage===s[0]).length}</span></button>`).join('')+`<button class="tab rev ${active===REV[0]?'active':''}" data-stage="${REV[0]}">↺ ${REV[1]}<span class="count">${data.filter(v=>v.stage===REV[0]).length}</span></button>`}
function renderStats(){const total=data.length,rev=data.filter(v=>v.stage===REV[0]).length; $('stats').innerHTML=`<div class="stat"><b>${total}</b>total de fichas</div><div class="stat"><b>${total-rev}</b>em andamento</div><div class="stat"><b>${data.filter(v=>v.stage==='finalizacao'||v.stage==='juridico').length}</b>finalização/jurídico</div><div class="stat"><b>${rev}</b>revertidas</div>`}
function renderList(){const info=stage(active),term=$('search').value.trim().toLowerCase();let items=data.filter(v=>v.stage===active).filter(v=>(v.client+' '+v.bank).toLowerCase().includes(term)).sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));$('title').textContent=info[1];$('description').textContent=info[3];if(!items.length){$('list').innerHTML=`<div class="empty">Nenhuma ficha aqui${term?' para essa busca':' ainda'}.</div>`;return}$('list').innerHTML=items.map(v=>{const reversed=v.stage===REV[0],stamp=reversed?`REV<br>${days(v.reversal?.date)}d`:`${info[2]}<br>${days(v.entry)}d`;const options=STAGES.map(s=>`<option value="${s[0]}" ${s[0]===v.stage?'selected':''}>${s[1]}</option>`).join('');return `<article class="card ${reversed?'reversed':''}"><div class="stamp ${reversed?'rev':''}">${stamp}</div><div class="card-info"><div class="name">${v.client||'Sem nome'}</div><div class="sub">${v.bank?v.bank+' · ':''}${money(v.value)} · entrada ${date(v.entry)}</div>${v.note?`<div class="obs">"${v.note}"</div>`:''}${reversed&&v.reversal?`<div class="reverse-tag">revertida de "${stage(v.reversal.from)[1]}" em ${date(v.reversal.date)} — motivo: ${v.reversal.reason||'não informado'}</div>`:''}</div><div class="actions">${reversed?`<div class="actions-row"><button class="primary" data-action="reactivate" data-id="${v.id}">Reativar</button><button class="danger" data-action="delete" data-id="${v.id}">Excluir</button></div>`:`<div class="actions-row">${next(v.stage)?`<button class="green" data-action="advance" data-id="${v.id}">Avançar →</button>`:''}<select class="mini" data-action="move" data-id="${v.id}">${options}</select></div><div class="actions-row"><button class="brick" data-action="toggle" data-id="${v.id}">Reverter</button><button class="danger" data-action="delete" data-id="${v.id}">Excluir</button></div><div class="reverse-box" id="reverse-${v.id}"><input id="reason-${v.id}" placeholder="Motivo da reversão"><button class="brick" data-action="confirm" data-id="${v.id}">Confirmar</button></div>`}</div></article>`}).join('')}
let celebrationTimer;function celebrate(client,stageId){const box=$('celebration'),info=stage(stageId),final=stageId==='finalizacao'||stageId==='juridico';box.className='celebration'+(final?' final':'')+' show';box.dataset.client=client;box.dataset.stage=info[1];box.innerHTML=`<strong>${final?'Parabéns, finalização alcançada!':'Cliente avançou de etapa!'}</strong><span>${client} entrou em ${info[1]}.</span><div class="celebration-actions"><button class="primary" data-celebration-action="jpeg">Baixar JPEG</button><button class="ghost" data-celebration-action="pdf">Salvar PDF</button></div>`;clearTimeout(celebrationTimer);celebrationTimer=setTimeout(()=>box.classList.remove('show'),6000)}function downloadJpeg(){const box=$('celebration'),canvas=document.createElement('canvas'),scale=2,width=900,height=230;canvas.width=width*scale;canvas.height=height*scale;const ctx=canvas.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle=box.classList.contains('final')?'#f8edd7':'#e7efe9';ctx.fillRect(0,0,width,height);ctx.fillStyle=box.classList.contains('final')?'#b07c2c':'#3f6d52';ctx.fillRect(0,0,8,height);ctx.fillStyle='#211f1a';ctx.font='600 30px Fraunces, serif';ctx.fillText(box.querySelector('strong').textContent,34,72);ctx.font='18px Inter, sans-serif';ctx.fillText(`${box.dataset.client} entrou em ${box.dataset.stage}.`,34,116);ctx.fillStyle='#5b564a';ctx.font='14px IBM Plex Mono, monospace';ctx.fillText('Painel de acompanhamento · Processos',34,176);const link=document.createElement('a');link.download=`comemoracao-${box.dataset.client.toLowerCase().replace(/[^a-z0-9]+/g,'-')}.jpg`;link.href=canvas.toDataURL('image/jpeg',.92);link.click()}function printPdf(){const box=$('celebration');box.classList.add('printing');window.print();box.classList.remove('printing')}function render(){renderTabs();renderStats();renderList()}
$('tabs').addEventListener('click',e=>{const button=e.target.closest('[data-stage]');if(button){active=button.dataset.stage;render()}});$('search').addEventListener('input',renderList);$('new').onclick=()=>{$('form').classList.add('show');$('date').value=today();$('client').focus()};$('cancel').onclick=()=>{$('form').classList.remove('show');['client','bank','value','date','note'].forEach(id=>$(id).value='')};$('save').onclick=async()=>{if(!$('client').value.trim()){$('client').focus();return}const nova={id:'v'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),client:$('client').value.trim(),bank:$('bank').value.trim(),value:parseFloat($('value').value)||0,entry:$('date').value||today(),note:$('note').value.trim(),stage:active===REV[0]?STAGES[0][0]:active,updated:new Date().toISOString()};data.push(nova);await store();$('cancel').click();render();celebrate(nova.client,nova.stage)};$('seller').value=localStorage.getItem('seller-name')||'';$('seller').onchange=()=>localStorage.setItem('seller-name',$('seller').value);
document.addEventListener('click',async e=>{const celebrationAction=e.target.closest('[data-celebration-action]')?.dataset.celebrationAction;if(celebrationAction==='jpeg'){downloadJpeg();return}if(celebrationAction==='pdf'){printPdf();return}const el=e.target.closest('[data-action]');if(!el||el.dataset.action==='move')return;const v=data.find(x=>x.id===el.dataset.id);if(!v)return;const action=el.dataset.action;if(action==='toggle'){$('reverse-'+v.id).classList.toggle('show');return}if(action==='advance'){v.stage=next(v.stage);celebrate(v.client,v.stage)}if(action==='confirm'){v.reversal={from:v.stage,date:today(),reason:$('reason-'+v.id).value.trim()};v.stage=REV[0];celebrate(v.client,v.stage)}if(action==='reactivate'){v.stage=v.reversal?.from||STAGES[0][0];delete v.reversal;celebrate(v.client,v.stage)}if(action==='delete'){if(!confirm(`Excluir a ficha de "${v.client}"? Essa ação não pode ser desfeita.`))return;data=data.filter(x=>x.id!==v.id)}v.updated=new Date().toISOString();await store();render()});document.addEventListener('change',async e=>{if(e.target.dataset.action!=='move')return;const v=data.find(x=>x.id===e.target.dataset.id);if(!v)return;v.stage=e.target.value;v.updated=new Date().toISOString();await store();render();celebrate(v.client,v.stage)});
try{data=JSON.parse(localStorage.getItem('pipeline-data')||'[]');last=JSON.stringify(data)}catch(e){data=[]}render();
</script></body></html>
